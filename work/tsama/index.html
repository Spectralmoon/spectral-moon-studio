<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tsama · Kayumari — Spectralmoon Studio</title>
<meta name="description" content="Kayumari — a film for Yogi, by Spectralmoon Studio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--espresso:#2A201A;--cream:#F1EAE0;--rose:#C76A89}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--espresso);color:var(--cream);font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px 18px 30px}
  .wrap{width:100%;max-width:860px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .brand{font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:20px;letter-spacing:-.01em;opacity:.85}
  .brand small{display:block;font-family:'Inter Tight';font-style:normal;font-size:9px;letter-spacing:.36em;text-transform:uppercase;opacity:.7;margin-top:3px}
  .eyebrow{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--rose);margin:18px 0 6px}
  h1{font-family:'Fraunces',serif;font-weight:400;font-size:clamp(30px,6vw,52px);line-height:1.02;letter-spacing:-.01em}
  h1 em{font-style:italic}
  .note{max-width:520px;font-size:14px;line-height:1.6;color:var(--cream);opacity:.82;margin:12px 0 20px}
  .note .sign{display:block;margin-top:14px;font-family:'Fraunces',serif;font-style:italic;opacity:.9}
  .player{max-width:100%;border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);background:#000;line-height:0}
  .player video{display:block;width:auto;height:auto;max-width:100%;max-height:66vh}
  .foot{margin-top:34px;font-size:12px;letter-spacing:.04em;opacity:.6;line-height:1.7}
  .foot a{color:var(--cream);text-decoration:none;border-bottom:1px solid rgba(241,234,224,.35)}
</style>
</head>
<body>
  <div class="wrap">
    <a href="https://spectralmoonstudio.com" class="brand" style="text-decoration:none;color:inherit">Spectralmoon<small>Studio</small></a>

    <div class="eyebrow">Tsama · Music Film</div>
    <h1>Kayumari</h1>

    <p class="note">
      Dear Yogi — here is the finished <em>Kayumari</em> film. Thank you for trusting us to give your music a world of its own. It was a joy to make.
      <span class="sign">— Susana, Spectralmoon Studio</span>
    </p>

    <div class="player">
      <video controls playsinline preload="metadata" poster="kayumari_music_poster.jpg">
        <source src="Kayumari_music.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
    </div>

    <div class="foot">
      Directed &amp; produced by <a href="https://spectralmoonstudio.com">Spectralmoon Studio</a><br>
      © Spectralmoon Studio · for Yogi
    </div>
  </div>
</body>
</html>
