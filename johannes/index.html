<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Johannes Braun · Digital Card</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Johannes Braun">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --honey:#EBCB87; --bronze:#B87A3C; --cream:#F6ECD6; --mist:#E0D2B2; --ink:#100B04;
  }
  html,body{height:100%}
  body{font-family:'Jost',sans-serif; background:#0B0803; color:var(--cream);
    display:flex; align-items:center; justify-content:center; min-height:100dvh; overflow-x:hidden}
  .card{position:relative; width:100%; max-width:430px; min-height:100dvh;
    background:#0B0803; overflow:hidden; isolation:isolate}
  @media(min-width:460px){
    body{padding:22px 0}
    .card{min-height:auto; aspect-ratio:9/16; border-radius:32px;
      box-shadow:0 40px 100px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.05)}
  }
  .hero{position:absolute; inset:0; z-index:0; overflow:hidden}
  .hero video{width:100%; height:100%; object-fit:cover; display:block;
    transform:scale(1.06); animation:drift 34s ease-in-out infinite alternate}
  @keyframes drift{from{transform:scale(1.06) translate3d(0,0,0)}
    to{transform:scale(1.13) translate3d(0,-1.4%,0)}}
  .vignette{position:absolute; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(125% 85% at 50% 45%, rgba(0,0,0,0) 52%, rgba(0,0,0,.42) 100%)}
  /* soft pool of shade behind the name so it reads over the moving water, no hard box */
  .namescrim{position:absolute; z-index:1; left:0; right:0; top:38%; height:34%; pointer-events:none;
    background:radial-gradient(80% 62% at 50% 50%, rgba(8,5,2,.66) 0%, rgba(8,5,2,.30) 48%, rgba(8,5,2,0) 78%)}

  .content{position:relative; z-index:2; display:flex; flex-direction:column;
    align-items:center; justify-content:center; min-height:100dvh; padding:40px 24px;
    text-align:center}
  @media(min-width:460px){.content{min-height:0; height:100%; position:absolute; inset:0}}

  .rise{opacity:0; transform:translateY(18px); animation:rise 1.1s cubic-bezier(.2,.7,.2,1) forwards}
  .rise.d2{animation-delay:.2s}
  @keyframes rise{to{opacity:1; transform:translateY(0)}}

  .name{font-family:'Italiana',serif; font-weight:400; font-style:normal;
    font-size:clamp(50px,15.5vw,72px); line-height:1.0; letter-spacing:.02em;
    color:#FBF3DE; -webkit-text-stroke:.5px #FBF3DE;
    text-shadow:0 2px 26px rgba(0,0,0,.78), 0 1px 6px rgba(0,0,0,.85), 0 0 60px rgba(235,203,135,.26)}
  .name .b{display:block; margin-top:2px;
    -webkit-text-stroke:.5px #E9C87B;
    background:linear-gradient(102deg,#B87A3C 0%,#F0DFB8 34%,#FBF4E0 48%,#EBCB87 64%,#B87A3C 100%);
    background-size:220% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 14px rgba(0,0,0,.6)); animation:sheen 7.5s ease-in-out infinite}
  @keyframes sheen{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

  .role{margin-top:26px; font-family:'Jost',sans-serif; font-weight:500;
    font-size:15px; letter-spacing:.46em; text-transform:uppercase; color:#FBF3DE; padding-left:.46em;
    text-shadow:0 1px 12px rgba(0,0,0,.9), 0 0 3px rgba(0,0,0,.75)}
  .role-de{margin-top:11px; font-family:'Italiana',serif; font-weight:400;
    font-size:17px; letter-spacing:.14em; color:var(--mist);
    text-shadow:0 1px 10px rgba(0,0,0,.85)}

  .dock{position:absolute; z-index:2; left:0; right:0; bottom:calc(38px + env(safe-area-inset-bottom));
    display:flex; gap:14px; justify-content:center}
  .ic{position:relative; display:flex; align-items:center; justify-content:center;
    width:58px; height:58px; border-radius:17px; cursor:pointer; color:var(--cream);
    text-decoration:none; isolation:isolate;
    background:linear-gradient(180deg, rgba(64,46,22,.54) 0%, rgba(28,18,7,.42) 100%);
    backdrop-filter:blur(22px) saturate(150%); -webkit-backdrop-filter:blur(22px) saturate(150%);
    border:1px solid rgba(235,203,135,.32);
    box-shadow:inset 0 1.5px 1px rgba(255,240,210,.36), inset 0 -6px 14px rgba(120,80,30,.16),
      0 16px 32px rgba(0,0,0,.5), 0 4px 10px rgba(0,0,0,.34);
    transition:transform .16s cubic-bezier(.2,.7,.2,1), filter .2s ease}
  .ic::before{content:""; position:absolute; left:0; right:0; top:0; height:50%; z-index:-1;
    border-radius:17px 17px 40% 40%/17px 17px 21px 21px;
    background:linear-gradient(180deg, rgba(255,255,255,.26), rgba(255,255,255,0)); pointer-events:none}
  .ic svg{width:25px; height:25px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
  .ic:hover{filter:brightness(1.1)}
  .ic:active{transform:translateY(1px) scale(.97)}
  .ic.tg{color:#231907;
    background:linear-gradient(180deg,#F5E0A6 0%,#E9C87B 40%,#D6A84E 72%,#B87A3C 100%);
    border:1px solid rgba(255,240,200,.58);
    box-shadow:inset 0 1.5px 1px rgba(255,255,255,.82), inset 0 -8px 16px rgba(150,100,25,.42),
      0 18px 36px rgba(184,122,60,.44), 0 4px 10px rgba(0,0,0,.32)}
</style>
</head>
<body>
  <div class="card">
    <div class="hero"><video src="woodwork.mp4" poster="poster.jpg" autoplay muted loop playsinline></video></div>
    <div class="vignette"></div><div class="namescrim"></div>

    <div class="content">
      <div class="name rise">Johannes<span class="b">Braun</span></div>
      <div class="rise d2">
        <div class="role">Woodwright</div>
        <div class="role-de">Holzkünstler</div>
      </div>
    </div>

    <div class="dock rise d2">
      <a class="ic tg" href="https://t.me/johannesbraun" target="_blank" rel="noopener" title="Telegram" aria-label="Telegram">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 18.7 19.4c-.2 1.1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.3-4.9 9-8.1c.4-.3-.1-.5-.6-.2L4.9 13.4l-4.8-1.5c-1-.3-1-1 .2-1.5L20.6 2.7c.9-.3 1.6.2 1.3 1.6z"/></svg>
      </a>
      <button class="ic" onclick="shareCard()" title="Share" aria-label="Share card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M8.5 7.5 12 4l3.5 3.5"/><rect x="5" y="11.5" width="14" height="9" rx="2.5"/></svg>
      </button>
    </div>
  </div>
<script>
  function shareCard(){var u=location.href;
    if(navigator.share){navigator.share({title:'Johannes Braun',url:u}).catch(function(){});}
    else if(navigator.clipboard){navigator.clipboard.writeText(u);alert('Link copied');}}
</script>
</body>
</html>
